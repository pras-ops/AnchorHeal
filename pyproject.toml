[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anchorheal"
version = "0.1.0"
description = "A drop-in self-healing layer for Python scrapers"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "rapidfuzz>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
testsite = [
    "flask>=3.0",
    "requests>=2.31",
]
browsers = [
    "selenium>=4.15",
    "playwright>=1.40",
    "pillow>=10.0",
]

[tool.setuptools.packages.find]
include = ["anchorheal*"]
exclude = ["scratch*", "tests*", "benchmark*"]

